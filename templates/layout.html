<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <link href="/statics/styles.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <title>{% block title %}{% endblock %}</title>
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCL6hw3quUFTchbHCXkclr-mFk47sLI9qk&libraries=places"></script>
    </head>

    <body class="{{ description_p }}">

        <header>

            <div class="container text-white" style="display: flex; align-items: center; font-size:20px;">
                <a href="/">
                    <img id="logo" src="/statics/LOGO.png" alt="Weather Icon" style="margin-right: 10px;">
                </a>
                <b>Weather App</b>

                <div class="search-bar">
                    <form action="/" method="POST">
                        <div class="input-group">
                            <input autofocus id="autocomplete" name="city" type="text" class="form-control" placeholder="City" aria-label="Search" aria-describedby="search-addon">
                            <script>
                                const input = document.getElementById('autocomplete');
                                const autocomplete = new google.maps.places.Autocomplete(input);
                            </script>


                            <button class="btn btn-outline-secondary" type="submit" id="search-addon">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>


            <div id="searched_cites" class="container " >
                <div id="searched_cites" class="btn-group  d-flex" role="group">
                {% for data in weather_data %}
                    <form action="/" method="post" class="d-inline">
                    <input type="hidden" name="city" value="{{ data.city }}">
                    <button type="submit" class="btn text-white">
                        <img src="{{ data.icon }}" alt="Weather Icon">{{ data.temp }}° {{ data.city }}
                    </button>
                    </form>
                {% endfor %}
            </div>


            </div>
            {% if invalid %}
            <div class="alert alert-warning alert-dismissible fade show">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            <strong>Invalid city name.</strong> Please try again.
            </div>
            {% endif %}


       </header>


        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>

        <footer>
            Powered by <a href="https://www.weatherapi.com/" title="Free Weather API">WeatherAPI.com</a>
        </footer>

    </body>



</html>
